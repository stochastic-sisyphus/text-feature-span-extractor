# =============================================================================
# Deploy CI/CD Pipeline
# =============================================================================
# Hosted-runner CI: code quality, Docker build (no push), and security scan.
# Runs on GitHub-hosted runners only. Deployment workflows are manual
# (workflow_dispatch / workflow_call) and are not triggered from here.
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "release/**", "feature/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_PRIMARY_VERSION: "3.11"
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Code Quality: Linting and Type Checking
  # ===========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_PRIMARY_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_PRIMARY_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-
            ${{ runner.os }}-pip-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.5" "mypy==1.19.1"

      - name: Install project deps
        run: pip install -e .

      - name: Run Ruff linter
        env:
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff_cache
        run: ruff check src/ --output-format=github

      - name: Run Ruff formatter check
        env:
          RUFF_CACHE_DIR: ${{ runner.temp }}/ruff_cache
        run: ruff format --check src/

      - name: Run MyPy type checker
        env:
          MYPY_CACHE_DIR: ${{ runner.temp }}/mypy_cache
        run: mypy src/ --ignore-missing-imports --no-error-summary



  # ===========================================================================
  # Docker Build (validation only; images are not pushed)
  # ===========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute lowercase image name
        id: names
        run: echo "lower=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          tags: |
            ghcr.io/${{ steps.names.outputs.lower }}:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.lower }}:latest
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
          # LiLT is opt-in: set repo variable WITH_LILT=1 (needs release lilt-weights-v1)
          build-args: |
            WITH_LILT=${{ vars.WITH_LILT || '0' }}
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build mlflow sidecar image
        uses: docker/build-push-action@v7
        with:
          context: ./infra/mlflow
          file: ./infra/mlflow/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ steps.names.outputs.lower }}-mlflow:${{ github.sha }}
            ghcr.io/${{ steps.names.outputs.lower }}-mlflow:latest
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,scope=mlflow,mode=max

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_PRIMARY_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_PRIMARY_VERSION }}

      - name: Install security tools and project deps
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e .

      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json -o bandit-report.json -ll
          bandit -r src/ -f txt -ll

      - name: Check dependencies for vulnerabilities
        run: |
          # CVE-2025-69872 (diskcache pickle deserialization) ignored: mlflow transitive dep, no fix version available upstream
          pip-audit --desc --fix --dry-run --ignore-vuln CVE-2025-69872 2>&1 | tee pip-audit-report.txt

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # CI Summary
  # ===========================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, docker, security]
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    steps:
      - name: Check job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Quality | ${QUALITY_RESULT} |"
            echo "| Docker | ${DOCKER_RESULT} |"
            echo "| Security | ${SECURITY_RESULT} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for result in "${QUALITY_RESULT}" "${DOCKER_RESULT}" "${SECURITY_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              fail=1
            fi
          done

          if [[ $fail -eq 1 ]]; then
            echo "**Overall Status: FAILED**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI Pipeline failed - one or more required jobs did not succeed"
            exit 1
          else
            echo "**Overall Status: PASSED**" >> "$GITHUB_STEP_SUMMARY"
          fi
