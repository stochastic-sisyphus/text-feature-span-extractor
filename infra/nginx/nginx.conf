worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # WebSocket support (Grafana live features)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Main server — HTTP behind ingress
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # PostgREST: /api/rpc/* → postgrest:3000
        # Strips /api/ only — PostgREST sees /rpc/<fn> (its native RPC surface).
        location /api/rpc/ {
            resolver 127.0.0.11 valid=5s;
            set $postgrest_upstream http://postgrest:3000;
            rewrite ^/api/(rpc/.*)$ /$1 break;
            proxy_pass $postgrest_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        # Grafana: /api/* → grafana:3000
        # Catches all Grafana-native /api/* paths (/api/plugins/, /api/live/ws,
        # /api/search, /api/health, etc.). WebSocket upgrade headers are required
        # here so /api/live/ws connections are not dropped.
        location /api/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # MLflow: /mlflow/ -> mlflow:5000 (resolved at request time so nginx
        # starts even if mlflow isn't running)
        # Protected by basic auth + IP allowlist (private ranges only)
        location /mlflow/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            auth_basic "MLflow";
            auth_basic_user_file /etc/nginx/.htpasswd;

            rewrite ^/mlflow/(.*)$ /$1 break;

            resolver 127.0.0.11 valid=5s;
            set $mlflow_upstream http://mlflow:5000;
            proxy_pass $mlflow_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Distinguishes "nginx alive, upstream dead" from "nginx dead" externally.
        location = /nginx-alive {
            access_log off;
            return 200 "ok\n";
        }

        # Plugin assets: bust Grafana's 1-hour cache so rebuilds take effect immediately
        location /public/plugins/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Root redirect -> plugin queue page
        location = / {
            return 302 /a/invoicex-labeling-app/queue;
        }

        # Grafana: / (default) -> grafana:3000
        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
