# Prometheus configuration for metrics collection
# Receives metrics via remote write from OpenTelemetry Collector

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'invoicex-monitor'

# Remote write receiver enabled via --web.enable-remote-write-receiver flag

# Alerting rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Scrape OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 15s

  # Scrape Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    scrape_interval: 30s

  # Scrape Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 30s

  # Scrape invoicex application metrics server (prometheus_client daemon thread on 9090)
  # FastAPI runs on 8080; the prometheus_client HTTP server is a separate daemon thread on 9090.
  - job_name: 'invoicex'
    static_configs:
      - targets: ['api:9090']
    scrape_interval: 15s
    metrics_path: /metrics

# Storage retention configured via command line flags in docker-compose.yml
