# Grafana dashboard provisioning
# Auto-loads dashboards from JSON files

apiVersion: 1

providers:
  - name: 'InvoiceX Dashboards'
    orgId: 1
    folder: 'InvoiceX'
    folderUid: 'invoicex'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
