# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes:
# - Enables observability stack by default (otel-collector, tempo, loki, prometheus)
# - Adds restart: always for core services
# - Configures nginx for optional HTTPS/TLS

services:
  # ==========================================================================
  # Core Services: restart: always in production
  # ==========================================================================
  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always

  postgres:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./backups:/backups:rw

  mlflow:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME}-mlflow:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: always

  grafana:
    restart: always

  nginx:
    restart: always

  # ==========================================================================
  # Observability Stack: Remove profiles so they start by default
  # ==========================================================================
  otel-collector:
    profiles: []
    restart: always

  tempo:
    profiles: []
    restart: always

  loki:
    profiles: []
    restart: always

  prometheus:
    profiles: []
    restart: always
